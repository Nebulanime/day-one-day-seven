<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghost Star Catcher — Day Seven build</title>
<style>
  html, body { margin: 0; padding: 0; background: #0d0710; height: 100%; overflow: hidden; }
  #game { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
// Ghost Star Catcher — a tiny browser game built by an AI agent from one prompt:
// "Build a tiny browser game: the make.fun ghost catches falling stars.
//  Arrow keys or mouse to move, score for each star caught, 30-second timer,
//  game-over screen with final score and restart. Dark background, magenta
//  accents, fun and readable."
// Day Seven build: Day seven: same map, same ghost, same seeded first stars — plus coins, catch particles, combos, faster spawns, more star colours, richer HUD. Seven days of daily updates.
const BUILD = 'day7';           // 'day1' or 'day7'
const DAY7 = BUILD === 'day7';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let bgCanvas = null, ghostSprite = null;
let starSprites = {}, coinSprite = null;

// Seeded RNG so day 1 and day 7 spawn the SAME stars in the SAME order:
// identical moments, a week apart. (Math.random is only used for particles.)
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(1337);

function makeStarSprite(color) {
  const S = 160, c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  g.translate(S / 2, S / 2);
  g.beginPath();
  const r = 62;
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 === 0 ? r : r * 0.45;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    g[i === 0 ? 'moveTo' : 'lineTo'](Math.cos(a) * rr, Math.sin(a) * rr);
  }
  g.closePath();
  g.fillStyle = color; g.shadowColor = color; g.shadowBlur = 26; g.fill();
  return c;
}
function makeCoinSprite() {
  const S = 160, c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  g.translate(S / 2, S / 2);
  g.beginPath(); g.arc(0, 0, 52, 0, Math.PI * 2);
  g.fillStyle = '#ffd94d'; g.shadowColor = '#ffd94d'; g.shadowBlur = 26; g.fill();
  g.shadowBlur = 0;
  g.strokeStyle = '#b8860b'; g.lineWidth = 8;
  g.beginPath(); g.arc(0, 0, 38, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#b8860b';
  g.font = '800 64px system-ui, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('3', 0, 4);
  return c;
}
function makeGhostSprite() {
  const r = 52, pad = 46, S = (r + pad) * 2;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');
  g.translate(S / 2, S / 2);
  g.beginPath();
  g.moveTo(-r, r * 0.9);
  g.lineTo(-r, -r * 0.2);
  g.arc(0, -r * 0.2, r, Math.PI, 0);
  g.lineTo(r, r * 0.9);
  const waves = 4, ww = (2 * r) / waves;
  for (let i = 0; i < waves; i++) {
    const cx = r - ww * (i + 0.5);
    g.arc(cx, r * 0.9, ww / 2, 0, Math.PI, i % 2 === 0);
  }
  g.closePath();
  const grad = g.createLinearGradient(0, -r, 0, r);
  grad.addColorStop(0, '#ffffff'); grad.addColorStop(1, '#ffd7f6');
  g.fillStyle = grad; g.shadowColor = '#ff4fd8'; g.shadowBlur = 30; g.fill();
  g.shadowBlur = 0;
  g.fillStyle = '#191419';
  g.beginPath(); g.ellipse(-r * 0.36, -r * 0.28, r * 0.13, r * 0.2, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(r * 0.36, -r * 0.28, r * 0.13, r * 0.2, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(0, r * 0.18, r * 0.16, r * 0.22, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(255,79,216,0.55)';
  g.beginPath(); g.ellipse(-r * 0.62, r * 0.08, r * 0.14, r * 0.08, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(r * 0.62, r * 0.08, r * 0.14, r * 0.08, 0, 0, Math.PI * 2); g.fill();
  return c;
}
function buildBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = Math.floor(W * DPR); bgCanvas.height = Math.floor(H * DPR);
  const g = bgCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#0d0710'; g.fillRect(0, 0, W, H);
  // static starfield dots (day 7: more + brighter twinkles baked in)
  const n = DAY7 ? 90 : 40;
  for (let i = 0; i < n; i++) {
    g.fillStyle = DAY7 ? 'rgba(255,255,255,' + (0.15 + rng() * 0.5).toFixed(2) + ')'
                       : 'rgba(255,255,255,0.25)';
    const s = DAY7 ? 2 + rng() * 3 : 2;
    g.fillRect((i * 173.3) % W, (i * 97.7) % H, s, s);
  }
  const fg = g.createLinearGradient(0, H - 260, 0, H);
  fg.addColorStop(0, 'rgba(255,79,216,0)');
  fg.addColorStop(1, DAY7 ? 'rgba(255,79,216,0.30)' : 'rgba(255,79,216,0.18)');
  g.fillStyle = fg; g.fillRect(0, H - 260, W, 260);
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBackground();
  ghostSprite = makeGhostSprite();
  starSprites = { '#ffd94d': makeStarSprite('#ffd94d'), '#ff4fd8': makeStarSprite('#ff4fd8') };
  coinSprite = makeCoinSprite();
}
window.addEventListener('resize', resize); resize();

const GAME_SECONDS = 30;
const state = {
  mode: 'title', score: 0, best: 0, combo: 0, comboT: 0,
  timeLeft: GAME_SECONDS, demo: true,
  ghost: { x: 0, y: 0, r: 52, tx: 0 },
  stars: [], coins: [], particles: [],
  keys: {}, mouseX: null, spawnT: 0, coinT: 2.5, elapsed: 0, lastTs: 0,
};
window.__gameState = state;

function resetGame() {
  state.score = 0; state.combo = 0; state.comboT = 0;
  state.timeLeft = GAME_SECONDS; state.elapsed = 0;
  state.stars = []; state.coins = []; state.particles = [];
  state.spawnT = 0; state.coinT = 2.5;
  state.ghost.x = W / 2; state.ghost.y = H - 190; state.ghost.tx = W / 2;
  state.mode = 'playing';
  for (let i = 0; i < 6; i++) {
    spawnStar();
    const s = state.stars[state.stars.length - 1];
    s.y = 200 + rng() * 1100;
  }
}
function spawnStar() {
  const r = 16 + rng() * 14;
  state.stars.push({
    x: 30 + rng() * (W - 60), y: -30, r: r,
    vy: (DAY7 ? 320 : 260) + rng() * 220 + state.elapsed * 6,
    rot: rng() * Math.PI, vr: (rng() - 0.5) * 2.2,
    hue: (DAY7 && rng() < 0.3) ? '#ff4fd8' : '#ffd94d',
  });
}
function spawnCoin() {
  state.coins.push({ x: 60 + rng() * (W - 120), y: -30, r: 22, vy: 300, rot: 0, vr: 2.4 });
}
function burst(x, y, color) {
  if (!DAY7) return;
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
    state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
      life: 0.55 + Math.random() * 0.3, t: 0, color, r: 2 + Math.random() * 4 });
  }
}
function drawStar(x, y, r, rot, color) {
  const spr = starSprites[color];
  const size = r * 2.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.drawImage(spr, -size / 2, -size / 2, size, size);
  ctx.restore();
}
function drawGhost(x, y, r) {
  const size = 196 * (r / 52);
  ctx.drawImage(ghostSprite, x - size / 2, y - size / 2, size, size);
}
function drawHUD() {
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 44px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE  ' + state.score, 36, 72);
  ctx.textAlign = 'right';
  const t = Math.max(0, Math.ceil(state.timeLeft));
  ctx.fillStyle = t <= 5 ? '#ff4fd8' : '#ffffff';
  ctx.fillText('⏱ ' + t + 's', W - 36, 72);
  const bw = W - 72, frac = Math.max(0, state.timeLeft / GAME_SECONDS);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(36, 92, bw, 10);
  ctx.fillStyle = '#ff4fd8';
  ctx.fillRect(36, 92, bw * frac, 10);
  if (DAY7) {
    ctx.textAlign = 'left';
    ctx.fillStyle = state.combo >= 3 ? '#ffd94d' : 'rgba(255,255,255,0.75)';
    ctx.font = '700 36px system-ui, sans-serif';
    ctx.fillText(state.combo >= 2 ? 'COMBO ×' + state.combo : 'BEST  ' + state.best, 36, 150);
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '600 30px system-ui, sans-serif';
    ctx.fillText('DAY 7 · 7 DAYS OF UPDATES', W - 36, 150);
  }
  if (state.demo && state.mode === 'playing') {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '600 30px system-ui, sans-serif';
    ctx.fillText('AUTO-PLAY · the ghost plays itself', W / 2, H - 36);
  }
}
function drawTitle() {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff4fd8';
  ctx.font = '800 64px system-ui, sans-serif';
  ctx.fillText('GHOST', W / 2, H * 0.30);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('STAR CATCHER', W / 2, H * 0.30 + 78);
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.font = '400 34px system-ui, sans-serif';
  ctx.fillText('Catch the falling stars!', W / 2, H * 0.30 + 150);
  ctx.font = '400 30px system-ui, sans-serif';
  ctx.fillText('← → or mouse to move · 30 seconds', W / 2, H * 0.30 + 205);
  ctx.fillStyle = '#ffd94d';
  ctx.font = '700 40px system-ui, sans-serif';
  ctx.fillText(state.demo ? '▶  DEMO STARTING…' : '▶  TAP / PRESS ANY KEY', W / 2, H * 0.62);
}
function drawGameOver() {
  ctx.fillStyle = 'rgba(13,7,16,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ff4fd8';
  ctx.font = '800 72px system-ui, sans-serif';
  ctx.fillText("TIME'S UP!", W / 2, H * 0.38);
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 52px system-ui, sans-serif';
  ctx.fillText('Final score: ' + state.score, W / 2, H * 0.38 + 90);
  if (state.score >= state.best && state.score > 0) {
    ctx.fillStyle = '#ffd94d';
    ctx.font = '700 40px system-ui, sans-serif';
    ctx.fillText('★ NEW BEST! ★', W / 2, H * 0.38 + 160);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.font = '400 36px system-ui, sans-serif';
    ctx.fillText('Best: ' + state.best, W / 2, H * 0.38 + 160);
  }
  ctx.fillStyle = '#ffd94d';
  ctx.font = '700 40px system-ui, sans-serif';
  ctx.fillText('↻  TAP TO PLAY AGAIN', W / 2, H * 0.62);
}
function update(dt) {
  if (state.mode !== 'playing') return;
  state.elapsed += dt;
  state.timeLeft -= dt;
  if (state.timeLeft <= 0) {
    state.timeLeft = 0; state.mode = 'over';
    state.best = Math.max(state.best, state.score);
    return;
  }
  if (state.comboT > 0) { state.comboT -= dt; if (state.comboT <= 0) state.combo = 0; }
  const g = state.ghost;
  let target = null;
  if (state.demo) {
    let bestY = -1;
    for (const s of state.stars) { if (s.y > bestY) { bestY = s.y; target = s.x; } }
    for (const c of state.coins) { if (c.y > bestY) { bestY = c.y; target = c.x; } }
    if (target === null) target = W / 2;
  } else if (state.mouseX !== null) {
    target = state.mouseX;
  } else {
    const sp = 620 * dt;
    if (state.keys['ArrowLeft']) g.x -= sp;
    if (state.keys['ArrowRight']) g.x += sp;
    target = g.x;
  }
  if (state.demo || state.mouseX !== null) {
    const dx = target - g.x;
    const step = Math.min(Math.abs(dx), 1150 * dt);
    g.x += Math.sign(dx) * step;
  }
  g.x = Math.max(g.r, Math.min(W - g.r, g.x));
  state.spawnT -= dt;
  if (state.spawnT <= 0) {
    spawnStar();
    state.spawnT = DAY7 ? 0.20 + rng() * 0.18 : 0.45 + rng() * 0.25;
  }
  if (DAY7) {
    state.coinT -= dt;
    if (state.coinT <= 0) { spawnCoin(); state.coinT = 2.2 + rng() * 1.2; }
  }
  const catchR = (o) => {
    const dx = o.x - g.x, dy = o.y - g.y;
    return dx * dx + dy * dy < (g.r + o.r * 0.8) * (g.r + o.r * 0.8);
  };
  for (let i = state.stars.length - 1; i >= 0; i--) {
    const s = state.stars[i];
    s.y += s.vy * dt; s.rot += s.vr * dt;
    if (catchR(s)) {
      state.combo = DAY7 ? state.combo + 1 : 0;
      state.comboT = 1.2;
      state.score += DAY7 && state.combo >= 3 ? 2 : 1;
      burst(s.x, s.y, s.hue);
      state.stars.splice(i, 1);
    } else if (s.y > H + 40) {
      state.combo = 0;
      state.stars.splice(i, 1);
    }
  }
  for (let i = state.coins.length - 1; i >= 0; i--) {
    const c = state.coins[i];
    c.y += c.vy * dt; c.rot += c.vr * dt;
    if (catchR(c)) {
      state.score += 3;
      burst(c.x, c.y, '#ffd94d');
      state.coins.splice(i, 1);
    } else if (c.y > H + 40) state.coins.splice(i, 1);
  }
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.t += dt;
    if (p.t >= p.life) { state.particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
  }
}
function render() {
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  if (state.mode === 'title') {
    drawGhost(W / 2, H * 0.48, 70);
    drawTitle();
    return;
  }
  for (const s of state.stars) drawStar(s.x, s.y, s.r, s.rot, s.hue);
  for (const c of state.coins) {
    const size = c.r * 2.6;
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(Math.sin(c.rot) * 0.4);
    ctx.drawImage(coinSprite, -size / 2, -size / 2, size, size);
    ctx.restore();
  }
  for (const p of state.particles) {
    ctx.globalAlpha = 1 - p.t / p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawGhost(state.ghost.x, state.ghost.y, state.ghost.r);
  drawHUD();
  if (state.mode === 'over') drawGameOver();
}
function loop(ts) {
  const dt = Math.min(0.05, (ts - state.lastTs) / 1000 || 0.016);
  state.lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
window.addEventListener('keydown', (e) => {
  state.keys[e.key] = true;
  if (['ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (state.mode === 'title') { state.demo = false; resetGame(); }
  else if (state.mode === 'over') { resetGame(); }
});
window.addEventListener('keyup', (e) => { state.keys[e.key] = false; });
function pointerMove(x) { state.mouseX = x; if (state.mode === 'playing') state.demo = false; }
window.addEventListener('pointermove', (e) => pointerMove(e.clientX));
window.addEventListener('pointerdown', (e) => {
  pointerMove(e.clientX);
  if (state.mode === 'title') { state.demo = false; resetGame(); }
  else if (state.mode === 'over') { resetGame(); }
});
state.ghost.x = W / 2; state.ghost.y = H - 190;
requestAnimationFrame(loop);
setTimeout(() => { if (state.mode === 'title') resetGame(); }, 1200);
</script>
</body>
</html>
